<article class="page">
  <header class="wrap subhero" appReveal>
    <p class="kicker"><span>04</span> Journal</p>
    <h1>Field notes on <em>light and matter</em>.</h1>
    <p class="lede">Short essays from the atelier. No trends. Observations we are willing to build with.</p>
  </header>

  <section class="section">
    <div class="wrap journal-grid">
      @for (note of notes; track note.slug) {
        <a matRipple class="note-card ripple-surface" appReveal [revealDelay]="$index * 90" [routerLink]="['/journal', note.slug]">
          <app-viz [kind]="note.viz" />
          <div class="copy">
            <span class="mono">{{ note.code }} · {{ note.date }}</span>
            <h3>{{ note.title }}</h3>
            <p>{{ note.excerpt }}</p>
          </div>
        </a>
      }
    </div>
  </section>
</article>
